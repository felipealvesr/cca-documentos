name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag que será gerada ou reparada (ex.: v0.2.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish CCA-Setup.exe
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.ref_name }}

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Cache OCR runtime and models
        uses: actions/cache@v4
        with:
          path: |
            .cache/python-embed.zip
            resources/ocr
          key: ocr-${{ runner.os }}-${{ hashFiles('ocr-worker/models.json', 'ocr-worker/requirements.txt') }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ env.RELEASE_TAG }}") {
            throw "A tag ${{ env.RELEASE_TAG }} precisa corresponder à versão v$version do package.json."
          }

      - name: Prepare offline OCR runtime
        run: python scripts/prepare-ocr.py

      - name: Validate
        run: |
          pnpm test
          pnpm run build

      - name: Build installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Generate update manifest
        run: node scripts/write-update-manifest.mjs

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $repo = "${{ github.repository }}"
          if (-not (Test-Path release/CCA-Setup.exe)) {
            throw "O instalador release/CCA-Setup.exe não foi gerado."
          }
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "CCA Documentos $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Não foi possível criar a Release $tag." }
          }
          $assets = @("release/CCA-Setup.exe", "release/latest.yml")
          if (Test-Path release/CCA-Setup.exe.blockmap) {
            $assets += "release/CCA-Setup.exe.blockmap"
          }
          gh release upload $tag --repo $repo --clobber $assets
